name: Actualizar calendario Algeciras CF

"on":
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"
      timezone: "Europe/Madrid"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar y actualizar calendario ICS
        run: python update_calendar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add algecirascfcalendar.ics
          if git diff --cached --quiet; then
            echo "Sin cambios en el calendario."
          else
            git commit -m "Actualizar calendario Algeciras CF"
            git push origin HEAD:${{ github.ref_name }}
          fi
